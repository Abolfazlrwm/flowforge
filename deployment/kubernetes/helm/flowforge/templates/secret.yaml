{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowforge.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  django-secret-key: {{ .Values.secret.djangoSecretKey | quote }}
  database-url: {{ .Values.secret.databaseUrl | quote }}
  rabbitmq-url: {{ .Values.secret.rabbitmqUrl | quote }}
  redis-url: {{ .Values.secret.redisUrl | quote }}
{{- end }}
