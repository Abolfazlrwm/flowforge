apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowforge.configMapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: {{ .Values.config.djangoSettingsModule | quote }}
  DJANGO_ALLOWED_HOSTS: {{ .Values.config.allowedHosts | quote }}
  THROTTLE_AUTH_RATE: {{ .Values.config.throttleAuthRate | quote }}
  THROTTLE_TRIGGER_RATE: {{ .Values.config.throttleTriggerRate | quote }}
  THROTTLE_READ_RATE: {{ .Values.config.throttleReadRate | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
