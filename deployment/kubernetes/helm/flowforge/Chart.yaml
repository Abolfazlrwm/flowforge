apiVersion: v2
name: flowforge
description: >-
  A Helm chart for deploying FlowForge, a distributed workflow orchestration
  engine built on Django, PostgreSQL and RabbitMQ. It deploys the web API, the
  scheduler, the publisher and the worker as separate Deployments, runs schema
  migrations as a Job, and includes probes, resource limits, a PodDisruptionBudget
  and a HorizontalPodAutoscaler for the worker, a non-root security context and a
  NetworkPolicy.
type: application
version: 1.0.0
appVersion: "1.0.0"
