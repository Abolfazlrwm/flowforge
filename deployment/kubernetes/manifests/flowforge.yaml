# Source: flowforge/templates/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ff-migrate
  namespace: flowforge
  labels:
    helm.sh/chart: flowforge-0.1.0
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/instance: ff
    app.kubernetes.io/version: "0.11.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migrate
  annotations:
    # Run on every install/upgrade, before the workloads come up.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/instance: ff
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ff-flowforge
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait
          image: ghcr.io/abolfazlrwm/flowforge:0.11.0
          imagePullPolicy: IfNotPresent
          # Block until PostgreSQL and RabbitMQ are reachable.
          command: ["python", "manage.py", "healthcheck"]
          envFrom:
            - configMapRef:
                name: ff-flowforge-config
            - secretRef:
                name: ff-flowforge-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: ghcr.io/abolfazlrwm/flowforge:0.11.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: ff-flowforge-config
            - secretRef:
                name: ff-flowforge-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
