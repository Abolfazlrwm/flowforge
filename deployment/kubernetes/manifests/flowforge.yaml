apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-publisher
  namespace: flowforge
  labels:
    helm.sh/chart: flowforge-0.1.0
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/instance: ff
    app.kubernetes.io/version: "0.11.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/instance: ff
      app.kubernetes.io/component: publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/instance: ff
        app.kubernetes.io/component: publisher
    spec:
      serviceAccountName: ff-flowforge
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-check
          image: ghcr.io/abolfazlrwm/flowforge:0.11.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--check", "--noinput"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: publisher
          image: ghcr.io/abolfazlrwm/flowforge:0.11.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - manage.py
            - publisher
            - --metrics-port
            - "9102"
          envFrom:
            - configMapRef:
                name: ff-flowforge-config
            - secretRef:
                name: ff-flowforge-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command: ["python", "manage.py", "healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["python", "manage.py", "healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "manage.py", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
