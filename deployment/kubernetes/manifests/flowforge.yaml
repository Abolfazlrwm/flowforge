apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-web
  namespace: flowforge
  labels:
    helm.sh/chart: flowforge-0.1.0
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/instance: ff
    app.kubernetes.io/version: "0.11.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flowforge
      app.kubernetes.io/instance: ff
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/instance: ff
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: ff-flowforge
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-check
          image: ghcr.io/abolfazlrwm/flowforge:0.11.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--check", "--noinput"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: web
          image: ghcr.io/abolfazlrwm/flowforge:0.11.0
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - flowforge.wsgi:application
            - -b
            - 0.0.0.0:"8000"
            - -w
            - "4"
            - --timeout
            - "60"
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ff-flowforge-config
            - secretRef:
                name: ff-flowforge-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /health/live/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
