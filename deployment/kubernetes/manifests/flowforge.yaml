# Source: flowforge/templates/networkpolicy.yaml
# Default-deny all ingress to the namespace. Egress is left at the cluster
# default (allowed) because PostgreSQL, RabbitMQ and Redis are reached over the
# network and their addresses are deployment-specific; tighten egress to your
# database/broker subnets in production.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ff-default-deny-ingress
  namespace: flowforge
  labels:
    helm.sh/chart: flowforge-0.1.0
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/instance: ff
    app.kubernetes.io/version: "0.11.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Source: flowforge/templates/networkpolicy.yaml
# Allow ingress to the web pods only (the API). Everything else (scheduler,
# publisher, worker) is reached only via PostgreSQL/RabbitMQ/Redis, never
# directly over the network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ff-web-ingress
  namespace: flowforge
  labels:
    helm.sh/chart: flowforge-0.1.0
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/instance: ff
    app.kubernetes.io/version: "0.11.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "ingress-nginx"
      ports:
        - port: 8000
          protocol: TCP
