apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ff-worker
  namespace: flowforge
  labels:
    helm.sh/chart: flowforge-0.1.0
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/instance: ff
    app.kubernetes.io/version: "0.11.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ff-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
