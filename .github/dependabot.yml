version: 2
updates:
  # Python dependencies are resolved with uv; Dependabot updates uv.lock
  # together with pyproject.toml constraints.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Patch releases arrive as one PR instead of one per package.
      python-patch:
        applies-to: version-updates
        update-types: ["patch"]
    ignore:
      # redis-py majors are deferred; the Django RedisCache backend tracks
      # compatibility closely, and a major bump is verified separately.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  # GitHub Actions are pinned to commit SHAs in .github/workflows/.
  # Dependabot rewrites both the SHA and the trailing version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for all action bumps. Upgrading them separately makes it
      # impossible to tell which one broke a job, and they always need the same
      # verification: a green CI run.
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The Docker base image tracks the interpreter the project actually
      # verifies. Django 5.2 supports Python 3.14 only from 5.2.8, and "all
      # dependencies verified on 3.14" has not been established.
      # Re-evaluate when the CI matrix gains 3.14 — see PROGRESS.md.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
