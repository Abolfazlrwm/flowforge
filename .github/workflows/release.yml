name: Release

# Attaches the supply-chain artifact — the CycloneDX SBOM — to a published
# GitHub Release.
#
# The SBOM is generated by the `supply-chain` job in CI on the main push for the
# released commit and stored as the `flowforge-sbom` artifact. This workflow
# resolves the release's commit, finds that CI run, downloads the artifact, and
# uploads it to the release, so a release carries a machine-readable inventory of
# exactly what shipped. This is the step the `supply-chain` job's
# `upload-release-assets: false` defers to.
#
# The container image is signed (keyless cosign, recorded in the Rekor
# transparency log) and attested (build provenance) by the same supply-chain job
# on main. Those live in Rekor and the registry and are referenced from the
# release notes; they are not uploaded here.
#
# It can also be run by hand (Actions -> Release -> Run workflow) with a tag, to
# attach the SBOM to an already-published release without publishing a new one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the SBOM to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write # upload release assets
  actions: read # locate and download the CI run's SBOM artifact

jobs:
  attach-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve the release tag and commit
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAG" || { echo "no release tag on the event"; exit 1; }
          SHA="$(git rev-list -n1 "$TAG")"
          test -n "$SHA" || { echo "tag $TAG did not resolve to a commit"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release $TAG -> commit $SHA"

      - name: Download the SBOM built for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # The SBOM is produced on the main push for this commit; find that run.
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}" \
            --jq '.workflow_runs[0].id')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::no CI run found for commit ${SHA}; cannot locate the SBOM"
            exit 1
          fi
          echo "using CI run ${RUN_ID}"
          gh run download "$RUN_ID" -n flowforge-sbom -D sbom
          # anchore/sbom-action uploads a single-file artifact under the artifact
          # name, so the file lands as `flowforge-sbom` regardless of the
          # `output-file` it was generated with. Normalize it to the documented
          # release-asset name so the check and the upload see the same path.
          if [ -f sbom/flowforge-sbom ] && [ ! -f sbom/flowforge-sbom.cdx.json ]; then
            mv sbom/flowforge-sbom sbom/flowforge-sbom.cdx.json
          fi
          test -f sbom/flowforge-sbom.cdx.json || { echo "SBOM file missing from artifact"; exit 1; }
          ls -l sbom

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release upload "$TAG" sbom/flowforge-sbom.cdx.json --clobber
