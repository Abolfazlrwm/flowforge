name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # All actions are pinned to commit SHAs; Dependabot keeps them current.
  UV_VERSION: "0.12.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify lock file is current
        run: uv lock --check
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy flowforge core api --ignore-missing-imports
        env:
          DJANGO_SETTINGS_MODULE: flowforge.settings.test
      # Security gates. `bandit` scans first-party code; the three intentional
      # findings (dev/test secrets and retry jitter) are annotated at the line,
      # not suppressed wholesale. `pip-audit` audits the locked dependency set
      # and fails on a known vulnerability, which is how the DRF 3.18.3 upgrade
      # was forced.
      - name: bandit
        run: uv run bandit -r core api flowforge -c pyproject.toml
      - name: pip-audit
        run: uv run pip-audit

  docs:
    # The documentation site was never built before Phase 3: mkdocs was not in
    # the dependency set, no job ran it, and the nav referenced a `docs/index.md`
    # that did not exist. `--strict` turns a broken internal link, a nav entry
    # with no target, and an unparseable page into a build failure.
    #
    # What this does NOT catch: a Mermaid diagram whose syntax is wrong. The
    # extension loading is all the build can prove, and that gap is recorded as
    # a limitation rather than implied away.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Build documentation (strict)
        run: uv run mkdocs build --strict

  schema:
    # `docs/api/openapi.yaml` is committed, so the schema shown to clients is a
    # reviewed artifact rather than a file that changes whenever a view changes.
    # This job regenerates it and fails if the committed file is stale, which is
    # what makes "the docs are the API" true: a code change that alters the
    # contract will not pass review until the schema has been regenerated and
    # committed alongside it.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: flowforge.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify lock file is current
        run: uv lock --check
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Generate the OpenAPI schema
        run: uv run python manage.py spectacular --file docs/api/openapi.yaml
      - name: Verify the committed schema is not stale
        run: git diff --exit-code docs/api/openapi.yaml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # A real broker so the publisher's confirm/mandatory/outage guarantees are
      # exercised, not assumed. Pinned tag matches compose.yaml.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          # Not `guest`: RabbitMQ restricts guest to loopback, and the runner
          # reaches the service over the Docker bridge, not 127.0.0.1.
          RABBITMQ_DEFAULT_USER: flowforge
          RABBITMQ_DEFAULT_PASS: flowforge
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
    env:
      DJANGO_SETTINGS_MODULE: flowforge.settings.test
      DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://flowforge:flowforge@localhost:5672/
      # Optional. Codecov rejects tokenless uploads, so without this secret the
      # upload step is skipped rather than failing silently behind a green job.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Migration check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: uv run python manage.py migrate --noinput
      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov --cov-report=xml

      # The concurrency tests are the only proof that the atomic conditional
      # UPDATE picks exactly one winner. On SQLite they skip, because SQLite
      # serialises writers and a race test there proves nothing. Without this
      # step the whole guarantee was silently unexercised in CI.
      #
      # REQUIRE_POSTGRES=1 turns the skip into a failure, so a database
      # misconfiguration goes red here instead of passing quietly.
      - name: Run integration tests (real PostgreSQL and RabbitMQ)
        run: uv run pytest tests/integration -v
        env:
          REQUIRE_POSTGRES: "1"
          REQUIRE_RABBITMQ: "1"

      - name: Upload coverage
        # Codecov rejects tokenless uploads ("Token required - not valid
        # tokenless upload") and the action still reports success, so this step
        # was a green box over a failure from Phase 0 until 2026-10-19.
        #
        # It is now skipped when no token is configured, so "skipped" is an
        # honest signal. When a token IS present, fail_ci_if_error is true so a
        # broken upload turns the job red instead of passing quietly.
        #
        # The 80% gate is enforced by pytest-cov regardless; Codecov only adds
        # PR annotations and a badge.
        if: github.event_name == 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  sdk:
    # `flowforge-client` is a separate distribution with its own lock file, so it
    # gets its own job: a change to the client cannot be validated by the server's
    # suite, and a change to the API's response shape that breaks the client must
    # fail here rather than in a user's application.
    #
    # The client has no runtime dependencies by design, so `uv sync` here installs
    # only the dev tools — which is also a check that the claim stays true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify the lock file is current
        run: uv lock --check
        working-directory: sdk
      - name: Install from the lock file
        run: uv sync --locked --extra dev
        working-directory: sdk
      - name: The client has no runtime dependencies
        run: |
          set -euo pipefail
          # `requires()` returns the extras too, and an extra is only installed on
          # request, so the check counts the requirements whose marker is not an
          # `extra == ...` guard. That is the set `pip install flowforge-client`
          # would pull in, which is the claim being protected.
          uv run python - <<'PY'
          import importlib.metadata as md

          base = [
              req
              for req in (md.requires("flowforge-client") or [])
              if "extra ==" not in req
          ]
          print(f"runtime requirements: {len(base)}")
          for requirement in base:
              print(f"  {requirement}")
          raise SystemExit(0 if not base else 1)
          PY
        working-directory: sdk
      - name: Ruff check
        run: uv run ruff check .
        working-directory: sdk
      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: sdk
      - name: mypy
        run: uv run mypy flowforge_client
        working-directory: sdk
      - name: pytest
        run: uv run pytest -q
        working-directory: sdk
      # The examples live at the repository root because that is where someone
      # looks for them, but they import the client, so they are checked here
      # where it is installed. Run from `sdk/` so this project's mypy config
      # applies, not the server's (which loads the Django plugin).
      - name: Examples — ruff
        run: uv run ruff check ../examples
        working-directory: sdk
      - name: Examples — mypy
        run: uv run mypy ../examples
        working-directory: sdk
      - name: Build the wheel and check the console script is declared
        run: |
          set -euo pipefail
          uv build --wheel
          wheel="$(ls dist/*.whl)"
          echo "$wheel"
          uv run python -c \
            "import sys, zipfile; \
             names = zipfile.ZipFile(sys.argv[1]).namelist(); \
             entry = [n for n in names if n.endswith('entry_points.txt')]; \
             assert entry, 'no entry_points.txt in the wheel'; \
             text = zipfile.ZipFile(sys.argv[1]).read(entry[0]).decode(); \
             assert 'flowforge = flowforge_client.cli:main' in text, text; \
             print('console script declared')" "$wheel"
        working-directory: sdk

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build production image
        run: docker build --target production -t flowforge:ci .

      - name: Start the full stack
        run: docker compose up -d --build

      # The migrate service is a one-shot gate that web/publisher/scheduler wait
      # on. Assert it exited 0, so a broken migration fails loudly here rather
      # than surfacing as a readiness timeout.
      - name: Migration gate exited cleanly
        run: |
          set -euo pipefail
          cid="$(docker compose ps -aq migrate)"
          test -n "$cid"
          docker inspect -f 'migrate status={{.State.Status}} exit={{.State.ExitCode}}' "$cid"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$cid")" = "0"

      - name: Scheduler, publisher and worker are healthy
        run: |
          set -euo pipefail
          for svc in scheduler publisher worker; do
            cid="$(docker compose ps -aq "$svc")"
            test -n "$cid"
            for attempt in $(seq 1 30); do
              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
              echo "$svc health=$health (attempt $attempt)"
              if [ "$health" = "healthy" ]; then break; fi
              sleep 2
            done
            test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = "healthy"
          done

      - name: Wait for readiness
        run: |
          set -uo pipefail
          code=""
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
              http://localhost:8000/health/ready/ || true)
            if [ "$code" = "200" ]; then
              echo "stack ready after ${attempt} attempt(s)"
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          echo "stack never became ready; last status=${code}"
          cat /tmp/ready.json 2>/dev/null || true
          docker compose ps || true
          exit 1

      - name: Liveness probe
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health/live/ | tee /tmp/live.json
          grep -Eq '"status": *"alive"' /tmp/live.json

      - name: Readiness payload reports every dependency
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health/ready/ | tee /tmp/ready-ok.json
          grep -Eq '"postgres": *"ok"' /tmp/ready-ok.json
          grep -Eq '"redis": *"ok"' /tmp/ready-ok.json
          grep -Eq '"rabbitmq": *"ok"' /tmp/ready-ok.json

      # The whole pipeline, not just the probes: trigger -> scheduler -> outbox ->
      # publisher -> RabbitMQ -> worker -> DB. `sample_run` exits non-zero unless the
      # run reaches SUCCEEDED, so a broken process fails this step.
      - name: End-to-end sample workflow (in process)
        run: docker compose exec -T web python manage.py sample_run --timeout 120

      # The same flow through the public surface: authenticate, publish, trigger,
      # poll. `sample_run` proves the pipeline; this proves the REST API drives it.
      - name: End-to-end via the REST API
        run: |
          set -euo pipefail
          docker compose exec -T web python manage.py e2e_token
          TOKEN="$(docker compose exec -T web cat /tmp/e2e_token | tr -d '\r\n')"
          BASE=http://localhost:8000/api/v1
          AUTH="Authorization: Token $TOKEN"

          curl -fsS -X POST "$BASE/workflows/" -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"sample-e2e","version":1,"description":"The compose end-to-end sample.","tasks":[{"key":"seed","task_type":"echo","config":{"value":"hello"}},{"key":"sum","task_type":"add","depends_on":["seed"],"config":{"values":[1,2,3]}},{"key":"done","task_type":"noop","depends_on":["sum"]}]}' \
            -o /tmp/workflow.json

          RUN_ID="$(curl -fsS -X POST "$BASE/runs/" -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"sample-e2e","version":1}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "triggered run $RUN_ID"

          for attempt in $(seq 1 120); do
            STATE="$(curl -fsS "$BASE/runs/$RUN_ID/" -H "$AUTH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            echo "run $RUN_ID state=$STATE (attempt $attempt)"
            if [ "$STATE" = "succeeded" ]; then exit 0; fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "cancelled" ]; then
              echo "run $RUN_ID ended $STATE"; exit 1
            fi
            sleep 1
          done
          echo "run $RUN_ID did not finish"; exit 1

      # Cron end to end: the running scheduler fires a ScheduledTrigger and the
      # run reaches SUCCEEDED through the real broker and worker. sample_run
      # drives the pipeline directly; this proves the cron path drives it too.
      - name: End-to-end cron-triggered workflow
        run: docker compose exec -T web python manage.py cron_e2e --timeout 120

      # Saga end to end: a task fails through the real worker and its compensator
      # actually executes; the run settles at its final FAILED state.
      - name: End-to-end saga compensation
        run: docker compose exec -T web python manage.py saga_e2e --timeout 120

      # --- End-to-end suite (tests/e2e) ---------------------------------------
      # The full user journey as a pytest suite: the REST API, the Python SDK and
      # the CLI, each driving a publish -> trigger -> complete cycle against the
      # live compose stack the steps above brought up. It runs here, in the same
      # healthy state and before any failure is injected, so a green run means a
      # real user's script works against a real deployment.
      - name: Mint an API token for the end-to-end suite
        id: e2e_token
        run: |
          set -euo pipefail
          docker compose exec -T web python manage.py e2e_token
          TOKEN="$(docker compose exec -T web cat /tmp/e2e_token | tr -d '\r\n')"
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set up Python for the end-to-end suite
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies from the lock file
        run: uv sync --locked --extra dev
      - name: Run the end-to-end suite against the live stack
        env:
          FLOWFORGE_E2E_BASE_URL: http://localhost:8000
          FLOWFORGE_E2E_TOKEN: ${{ steps.e2e_token.outputs.token }}
        run: uv run pytest tests/e2e -v

      # --- Failure injection -------------------------------------------------
      # The pytest suite kills worker and scheduler *processes* (see
      # tests/integration/test_failure_injection.py). Container- and
      # infrastructure-level faults cannot be produced from inside a test, so they
      # are injected here, against the same compose stack the e2e just used.

      # Readiness must name the dependency that is actually down. A probe that
      # reports "ready" while the broker is stopped is worse than no probe.
      #
      # This step also proves the reconnection work end to end: a workflow is
      # triggered *while the broker is down*, so its dispatch has nowhere to go.
      # Nothing is restarted by hand afterwards — the scheduler, publisher and
      # worker must recover on their own and finish the run.
      # --- Failure injection: broker restart ---------------------------------
      # Proves the WORKER and PUBLISHER reconnect to RabbitMQ without a process
      # restart, and that the SCHEDULER (which never connects to the broker) is
      # unaffected. Asserts each process individually so a silent failure in one
      # cannot hide behind the others.
      - name: Broker restart — worker and publisher reconnect, scheduler unaffected, no process restart
        run: |
          set -euo pipefail
          BASE=http://localhost:8000/api/v1
          TOKEN="$(docker compose exec -T web cat /tmp/e2e_token | tr -d '\r\n')"
          AUTH="Authorization: Token $TOKEN"

          # Container identities before: a manual restart would change them, and the
          # whole point is that none happens.
          docker compose ps -q worker publisher scheduler > /tmp/ids-before
          cat /tmp/ids-before

          docker compose stop rabbitmq

          code=""
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/ready-down.json -w '%{http_code}' \
              http://localhost:8000/health/ready/ || true)
            echo "readiness=$code (attempt $attempt)"
            if [ "$code" = "503" ]; then break; fi
            sleep 1
          done
          test "$code" = "503" || { echo "readiness did not degrade"; cat /tmp/ready-down.json; exit 1; }
          cat /tmp/ready-down.json
          grep -Eq '"rabbitmq": *"error"' /tmp/ready-down.json

          # Queue work while the broker is down. The API only needs PostgreSQL, so
          # the run is created; its dispatch cannot be published until recovery.
          RUN_ID="$(curl -fsS -X POST "$BASE/runs/" -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"sample-e2e","version":1}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "queued run $RUN_ID during the outage"

          docker compose start rabbitmq
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /tmp/ready-up.json -w '%{http_code}' \
              http://localhost:8000/health/ready/ || true)
            echo "readiness=$code (attempt $attempt)"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$code" = "200" || { echo "readiness did not recover"; cat /tmp/ready-up.json; exit 1; }

          # WORKER: it logged a reconnect and is the same container as before.
          docker compose logs --no-color worker | grep -Eq "reconnecting in" \
            || { echo "WORKER: never logged a reconnect"; docker compose logs --no-color worker; exit 1; }

          # PUBLISHER: it failed a sweep and then recovered (the queued run above
          # guaranteed a sweep had something to fail on). Poll, don't sleep.
          recovered=""
          for attempt in $(seq 1 60); do
            if docker compose logs --no-color publisher | grep -Eq "Publisher recovered"; then
              recovered="yes"; echo "publisher recovered (attempt $attempt)"; break
            fi
            sleep 1
          done
          test "$recovered" = "yes" || { echo "PUBLISHER: never logged a recovery"; docker compose logs --no-color publisher; exit 1; }

          # SCHEDULER: never connects to the broker, so the outage is irrelevant to
          # it; prove it was not restarted and kept scheduling (the run completes).
          docker compose ps -q worker publisher scheduler > /tmp/ids-after
          diff -u /tmp/ids-before /tmp/ids-after \
            || { echo "a process was restarted; automatic recovery was not exercised"; exit 1; }

          # The proof that matters: the run queued during the outage completes,
          # with no process restart and no manual intervention — the worker
          # reconnected, the publisher delivered, and the scheduler dispatched it.
          for attempt in $(seq 1 120); do
            STATE="$(curl -fsS "$BASE/runs/$RUN_ID/" -H "$AUTH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            echo "run $RUN_ID state=$STATE (attempt $attempt)"
            if [ "$STATE" = "succeeded" ]; then break; fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "cancelled" ]; then
              echo "run $RUN_ID ended $STATE"; exit 1
            fi
            sleep 1
          done
          test "$STATE" = "succeeded" || { echo "the run queued during the outage never completed"; docker compose logs --no-color scheduler publisher worker | tail -100; exit 1; }

      # --- Failure injection: PostgreSQL restart ------------------------------
      # Proves the SCHEDULER, PUBLISHER and WORKER survive a database restart
      # without a process restart. The loop processes hold one connection for
      # their whole life, so the restart kills that socket; each must discard it,
      # back off, and reconnect on its own.
      - name: PostgreSQL restart — scheduler and publisher recover and the worker completes work, no process restart
        run: |
          set -euo pipefail
          BASE=http://localhost:8000/api/v1
          TOKEN="$(docker compose exec -T web cat /tmp/e2e_token | tr -d '\r\n')"
          AUTH="Authorization: Token $TOKEN"

          docker compose ps -q worker publisher scheduler > /tmp/ids-before
          cat /tmp/ids-before

          # The compose service is named `db`, not `postgres`. Getting this wrong
          # fails the step with "no such service", which is how this was caught.
          docker compose restart db

          code=""
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready-db.json -w '%{http_code}' \
              http://localhost:8000/health/ready/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$code" = "200" || { echo "stack did not survive the DB restart"; cat /tmp/ready-db.json; exit 1; }
          grep -Eq '"postgres": *"ok"' /tmp/ready-db.json

          # SCHEDULER: it lost its connection on the restart and logged a recovery.
          # Its loop interval is 5s, so poll rather than assume it has already run.
          srecovered=""
          for attempt in $(seq 1 60); do
            if docker compose logs --no-color scheduler | grep -Eq "Scheduler recovered"; then
              srecovered="yes"; echo "scheduler recovered (attempt $attempt)"; break
            fi
            sleep 1
          done
          test "$srecovered" = "yes" || { echo "SCHEDULER: never logged a recovery after the DB restart"; docker compose logs --no-color scheduler; exit 1; }

          # PUBLISHER: same — its sweep failed on the dead connection and recovered.
          precovered=""
          for attempt in $(seq 1 60); do
            if docker compose logs --no-color publisher | grep -Eq "Publisher recovered"; then
              precovered="yes"; echo "publisher recovered (attempt $attempt)"; break
            fi
            sleep 1
          done
          test "$precovered" = "yes" || { echo "PUBLISHER: never logged a recovery after the DB restart"; docker compose logs --no-color publisher; exit 1; }

          # No process was restarted by hand.
          docker compose ps -q worker publisher scheduler > /tmp/ids-after
          diff -u /tmp/ids-before /tmp/ids-after \
            || { echo "a process was restarted; automatic recovery was not exercised"; exit 1; }

          # WORKER: a fresh workflow is dispatched and completes against the
          # restarted database, with no worker restart. This exercises the worker's
          # per-message DB-error path end to end.
          RUN_ID="$(curl -fsS -X POST "$BASE/runs/" -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"sample-e2e","version":1}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "queued run $RUN_ID after the DB restart"
          for attempt in $(seq 1 120); do
            STATE="$(curl -fsS "$BASE/runs/$RUN_ID/" -H "$AUTH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            echo "run $RUN_ID state=$STATE (attempt $attempt)"
            if [ "$STATE" = "succeeded" ]; then break; fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "cancelled" ]; then
              echo "run $RUN_ID ended $STATE"; exit 1
            fi
            sleep 1
          done
          test "$STATE" = "succeeded" || { echo "the post-restart run never completed"; docker compose logs --no-color scheduler publisher worker | tail -100; exit 1; }

      # Failure mode 17: does a *confirmed* publish survive an abrupt broker death?
      #
      # A classic durable queue can acknowledge a message it has not flushed; a
      # quorum queue fsyncs through Raft before confirming. To test the claim
      # rather than assert it, park a dispatch in the queue with no consumer,
      # SIGKILL the broker (not `stop`: no graceful shutdown, no flush), restart
      # it, and require the message to still be there.
      - name: A confirmed dispatch survives an abrupt broker kill
        run: |
          set -euo pipefail
          BASE=http://localhost:8000/api/v1
          TOKEN="$(docker compose exec -T web cat /tmp/e2e_token | tr -d '\r\n')"
          AUTH="Authorization: Token $TOKEN"

          # No consumer, so the message stays in the queue once published.
          docker compose stop worker

          RUN_ID="$(curl -fsS -X POST "$BASE/runs/" -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"sample-e2e","version":1}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "queued run $RUN_ID"

          # Wait until the publisher has confirmed every outbox row (a poll, not a
          # sleep): only then is the dispatch genuinely "confirmed" by the broker.
          #
          # `manage.py shell -c` prints an "N objects imported automatically"
          # banner with no trailing newline, which glues itself to the number. The
          # sentinel keeps the parse honest instead of depending on that banner.
          pending="unknown"
          for attempt in $(seq 1 60); do
            pending="$(docker compose exec -T web python manage.py shell -c \
              'from core.models import OutboxMessage; print("PENDING=" + str(OutboxMessage.objects.filter(published_at__isnull=True).count()))' \
              2>/dev/null | grep -oE 'PENDING=[0-9]+' | cut -d= -f2 | tail -1 || true)"
            echo "pending outbox rows=${pending:-?} (attempt $attempt)"
            if [ "$pending" = "0" ]; then break; fi
            sleep 1
          done
          test "$pending" = "0" || { echo "the dispatch was never published"; exit 1; }

          docker compose kill rabbitmq          # SIGKILL: no flush, no goodbye
          docker compose start rabbitmq
          for attempt in $(seq 1 60); do
            if docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1; then break; fi
            sleep 1
          done

          docker compose start worker

          for attempt in $(seq 1 120); do
            STATE="$(curl -fsS "$BASE/runs/$RUN_ID/" -H "$AUTH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            echo "run $RUN_ID state=$STATE (attempt $attempt)"
            if [ "$STATE" = "succeeded" ]; then exit 0; fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "cancelled" ]; then
              echo "run $RUN_ID ended $STATE after the broker was killed"; exit 1
            fi
            sleep 1
          done
          echo "the dispatch did not survive an abrupt broker kill"
          docker compose logs --no-color rabbitmq worker | tail -60
          exit 1

      # --- Observability profile ---------------------------------------------
      # Phase 9's acceptance requires the profile to actually run, not merely to
      # parse. These steps bring it up against the live stack the steps above
      # used, so the assertions are about a system that has real runs in it.

      # Every process exposes its own registry. The web process serves the same
      # registry over HTTP; the other three run their own metrics server.
      - name: Observability — each process exposes Prometheus metrics
        run: |
          set -euo pipefail

          curl -fsS http://localhost:8000/api/v1/metrics/ | tee /tmp/web-metrics.txt
          grep -Eq '^# HELP flowforge_workflow_runs ' /tmp/web-metrics.txt
          grep -Eq '^flowforge_workflow_runs\{state="succeeded"\} [1-9]' /tmp/web-metrics.txt
          grep -Eq '^flowforge_dead_tasks ' /tmp/web-metrics.txt

          for entry in 9101:scheduler 9102:publisher 9103:worker; do
            port="${entry%%:*}"; svc="${entry##*:}"
            body="$(curl -fsS "http://localhost:${port}/metrics")"
            echo "$body" | grep -Eq '^flowforge_task_runs\{' \
              || { echo "$svc: no task-run gauge on :$port"; exit 1; }
            echo "$svc: metrics reachable on :$port"
          done

      - name: Observability — profile starts and scrapes the live stack
        run: |
          set -euo pipefail
          # Retry the bring-up: the runner's Docker daemon occasionally returns a
          # 500 mid-pull ("received unexpected HTTP status: 500 Internal Server
          # Error", with the containers reported Interrupted), which has nothing
          # to do with this repository. Retrying does not soften a single
          # assertion below — every target still has to come up UP and every
          # endpoint still has to answer.
          #
          # No teardown between attempts: `docker compose down` would take the
          # application stack with it, and `up -d` is already idempotent.
          ready=""
          for attempt in $(seq 1 3); do
            if docker compose --profile observability up -d prometheus grafana otel-collector; then
              ready="yes"
              break
            fi
            echo "profile bring-up failed (attempt $attempt); retrying"
            sleep 10
          done
          test "$ready" = "yes" || { echo "the observability profile never came up"; exit 1; }

          # Prometheus: ready, then every FlowForge target UP. A target that is
          # DOWN means the scrape config does not match the stack, which is the
          # failure mode a dashboard-as-code file cannot catch on its own.
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9090/-/ready >/dev/null \
            || { echo "Prometheus never became ready"; exit 1; }
          sleep 20   # two scrape intervals, so a target has reported at least once

          for attempt in $(seq 1 30); do
            up="$(curl -fsS 'http://localhost:9090/api/v1/targets' \
              | python3 -c 'import json,sys; print(sum(1 for t in json.load(sys.stdin)["data"]["activeTargets"] if t["labels"]["job"].startswith("flowforge-") and t["health"]=="up"))')"
            echo "flowforge targets up: $up (attempt $attempt)"
            test "$up" = "4" && break
            sleep 2
          done
          test "$up" = "4" || {
            echo "expected 4 FlowForge targets UP, got $up"
            curl -fsS 'http://localhost:9090/api/v1/targets' | python3 -m json.tool | head -60
            exit 1
          }

          # The dashboard is provisioned from the committed JSON, so a malformed
          # file or a missing datasource shows up here rather than in a browser.
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health >/dev/null \
            || { echo "Grafana never became healthy"; exit 1; }
          found="$(curl -fsS -H 'Content-Type: application/json' \
            http://localhost:3000/api/search?query=FlowForge \
            | python3 -c 'import json,sys; print(any(d.get("uid")=="flowforge-overview" for d in json.load(sys.stdin)))')"
          test "$found" = "True" \
            || { echo "the FlowForge dashboard was not provisioned"; exit 1; }

          # The collector accepts OTLP/HTTP, which is what the app exports to when
          # OTEL_EXPORTER_OTLP_ENDPOINT is set.
          curl -fsS -X POST http://localhost:4318/v1/traces \
            -H 'Content-Type: application/json' -d '{"resourceSpans":[]}' \
            || { echo "the collector did not accept an OTLP/HTTP export"; exit 1; }

      # --- Backup / restore drill --------------------------------------------
      # Phase 11, task #4: a real restore drill with evidence — not a documented
      # hope. Dump the live database, wipe it, restore it, prove every row came
      # back, and prove a workflow still executes end to end against the restored
      # data. The application stack keeps running; only its database is destroyed
      # and rebuilt underneath it.
      - name: Backup and restore drill (PostgreSQL + RabbitMQ definitions)
        run: |
          set -euo pipefail

          # Freeze writes so the before/after counts are taken against a stable
          # database. The processes are restarted afterwards and reconnect to the
          # restored data on their next query.
          docker compose stop scheduler publisher worker web
          sleep 3

          # 1. Baseline row counts, read straight from PostgreSQL (no Django
          #    import path needed) so the restore is verified against a real,
          #    known-good value rather than an assumption.
          COUNT_SQL="SELECT 'core_organization='    || COUNT(*) FROM core_organization
          UNION ALL SELECT 'core_membership='      || COUNT(*) FROM core_membership
          UNION ALL SELECT 'core_apikey='          || COUNT(*) FROM core_apikey
          UNION ALL SELECT 'core_auditlog='        || COUNT(*) FROM core_auditlog
          UNION ALL SELECT 'core_workflow='        || COUNT(*) FROM core_workflow
          UNION ALL SELECT 'core_task='            || COUNT(*) FROM core_task
          UNION ALL SELECT 'core_workflowrun='     || COUNT(*) FROM core_workflowrun
          UNION ALL SELECT 'core_taskrun='         || COUNT(*) FROM core_taskrun
          UNION ALL SELECT 'core_outboxmessage='   || COUNT(*) FROM core_outboxmessage
          UNION ALL SELECT 'core_scheduledtrigger='|| COUNT(*) FROM core_scheduledtrigger
          UNION ALL SELECT 'core_taskrunevent='    || COUNT(*) FROM core_taskrunevent
          ORDER BY 1;"
          docker compose exec -T db psql -U flowforge -d flowforge -t -A -c "$COUNT_SQL" > /tmp/before.counts
          echo "BEFORE restore:"; cat /tmp/before.counts

          # 2. Dump PostgreSQL in custom format (restorable, parallel-friendly)
          #    and prove the file really is a custom-format archive. The magic is
          #    PGDMP, five bytes, and it is the only cheap check that catches a
          #    dump that silently wrote an error page or truncated.
          docker compose exec -T db sh -c 'pg_dump -U flowforge -Fc flowforge > /tmp/flowforge.dump'
          docker compose exec -T db sh -c 'head -c 5 /tmp/flowforge.dump' > /tmp/dump.magic
          if ! grep -q 'PGDMP' /tmp/dump.magic; then
            echo "the dump does not begin with the pg_dump custom-format magic PGDMP"
            docker compose exec -T db sh -c 'head -c 16 /tmp/flowforge.dump | od -An -c'
            exit 1
          fi
          echo "dump magic: PGDMP"
          docker compose exec -T db ls -l /tmp/flowforge.dump

          # 3. Export RabbitMQ definitions (durable topology: quorum queues,
          #    exchanges, bindings, users, vhost, permissions) and prove the
          #    export is genuinely re-importable by feeding it straight back into
          #    the same broker (a no-op for existing resources).
          #
          #    `rabbitmqctl`, not the HTTP API: this stack runs
          #    rabbitmq:3.13-alpine, which neither enables the management plugin
          #    nor ships curl. `export_definitions -` writes JSON to stdout, so no
          #    file has to be shuttled out of the container either.
          docker compose exec -T rabbitmq rabbitmqctl export_definitions - > /tmp/rabbitmq-defs.json
          python3 - <<'PY'
          import json
          with open('/tmp/rabbitmq-defs.json') as fh:
              d = json.load(fh)
          q = d.get('queues', [])
          assert any(qd.get('type') == 'quorum' for qd in q), "no quorum queue in export"
          print("rabbitmq definitions: queues=%d exchanges=%d vhosts=%d users=%d"
                % (len(q), len(d.get('exchanges', [])), len(d.get('vhosts', [])), len(d.get('users', []))))
          PY
          #    The import takes a real path, not `-`. RabbitMQ 3.13 advertises
          #    `<file_path | "-">` in its usage text, but validate/2 calls
          #    File.exists?("-") and rejects it; stdin is only read when no
          #    argument is given at all. A path is unambiguous on every version.
          docker compose cp /tmp/rabbitmq-defs.json rabbitmq:/tmp/rabbitmq-defs.json
          docker compose exec -T rabbitmq rabbitmqctl import_definitions /tmp/rabbitmq-defs.json \
            || { echo "rabbitmq definitions were not re-importable"; exit 1; }
          echo "rabbitmq definitions re-imported cleanly"

          # 4. Wipe: terminate any lingering backend, drop and recreate the
          #    database. This is the "wipe" the drill must survive.
          docker compose exec -T db psql -U flowforge -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='flowforge' AND pid <> pg_backend_pid();"
          docker compose exec -T db psql -U flowforge -d postgres -c "DROP DATABASE flowforge;"
          docker compose exec -T db psql -U flowforge -d postgres -c "CREATE DATABASE flowforge OWNER flowforge;"

          # 5. Restore from the dump onto the freshly created (empty) database.
          docker compose exec -T db sh -c 'pg_restore -U flowforge --dbname=flowforge --no-owner --clean --if-exists /tmp/flowforge.dump' \
            && echo "pg_restore: completed" \
            || echo "pg_restore: exited non-zero; verifying restored data below"

          # 6. Verify: the row counts must match the baseline exactly.
          docker compose exec -T db psql -U flowforge -d flowforge -t -A -c "$COUNT_SQL" > /tmp/after.counts
          echo "AFTER restore:"; cat /tmp/after.counts
          if ! diff -u /tmp/before.counts /tmp/after.counts; then
            echo "ROW COUNTS DIVERGED AFTER RESTORE"; exit 1
          fi
          echo "row counts identical before/after restore"

          # 7. Prove the restored database actually runs a workflow: bring the
          #    stack back, wait for readiness, and execute the full pipeline.
          docker compose start web scheduler publisher worker
          code=""
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/health/ready/ || true)
            if [ "$code" = "200" ]; then echo "stack ready after restore (attempt $attempt)"; break; fi
            sleep 2
          done
          test "$code" = "200" || { echo "stack did not become ready after restore"; docker compose logs --no-color --tail=120; exit 1; }
          docker compose exec -T web python manage.py sample_run --timeout 120
          echo "workflow executed end to end against the restored database"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  loadtest:
    # Phase 9's acceptance requires a REAL measured benchmark, and it explicitly
    # forbids inventing numbers. The numbers therefore come from here: a real
    # compose stack, a real broker, a real PostgreSQL, and the same Locust file
    # the documentation tells an operator to run.
    #
    # What these numbers are NOT: a production benchmark. The runner is a shared
    # 4-vCPU VM with a noisy neighbour and a containerised database on the same
    # host as the load generator, so the absolute figures are a floor, not a
    # target. The report in docs/development/BENCHMARKS.md states the machine and
    # the configuration next to the results for exactly this reason.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The benchmark measures the engine, not the throttle. The shipped defaults
      # are 60 triggers/min and 300 reads/min per caller; ten virtual users
      # triggering and polling immediately exhaust that, and the first run of this
      # job recorded 1469 `429` responses and almost no real measurements. These
      # rates are set high enough that the throttle is not the binding constraint,
      # which the report states.
      THROTTLE_TRIGGER_RATE: "100000/min"
      THROTTLE_READ_RATE: "100000/min"
      # Every virtual user authenticates as the same fixture account, so ten
      # logins in the first second would trip the 10/min default on their own.
      THROTTLE_AUTH_RATE: "100000/min"
      # The scheduler polls every 5s by default, and a 4-task diamond needs four
      # passes — so the default cadence puts a 20-second floor under every run and
      # the first run of this job measured exactly that (median end-to-end
      # 20000 ms). Lowering it measures the engine instead of the poll interval.
      SCHEDULER_INTERVAL: "0.25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install from lock file (load tests need Locust)
        run: uv sync --locked --extra dev

      - name: Record the machine
        run: |
          # Written into the artifact, not /tmp: the report cites these figures,
          # and an environment description that is not committed with the numbers
          # is an unverifiable claim.
          mkdir -p loadtest-results
          {
            echo "runner: $(uname -srm)"
            echo "cpus: $(nproc)"
            grep -m1 'model name' /proc/cpuinfo || true
            free -h | head -2
            echo "locust: $(uv run locust --version 2>&1 | head -1)"
            echo "python: $(python -V 2>&1)"
            echo "uv: $(uv --version)"
            echo "docker: $(docker --version)"
            echo "commit: $(git rev-parse HEAD)"
          } | tee loadtest-results/environment.txt

      - name: Build production image
        run: docker build --target production -t flowforge:ci .

      - name: Start the stack
        run: docker compose up -d --build

      - name: Create the load-test user
        run: docker compose exec -T web python manage.py loadtest_user

      - name: Wait for readiness
        run: |
          set -uo pipefail
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready/ || true)
            if [ "$code" = "200" ]; then echo "ready after ${attempt} attempt(s)"; exit 0; fi
            sleep 2
          done
          echo "stack never became ready"; docker compose ps; exit 1

      # A fixed, reproducible shape: 10 users, 2/s spawn, 60 seconds. Locust's
      # headless mode writes a machine-readable CSV per request name, which is
      # what gets committed as the raw evidence.
      - name: Run the load test
        run: |
          set -uo pipefail
          mkdir -p loadtest-results
          uv run locust \
            -f loadtests/locustfile.py \
            --headless \
            --only-summary \
            --users 10 \
            --spawn-rate 2 \
            --run-time 60s \
            --csv loadtest-results/run \
            --host http://localhost:8000 \
            2>&1 | tee loadtest-results/locust.log
          # Locust exits non-zero on any failed request; a failed run under load
          # is a real defect, so the job must fail rather than archive it quietly.
          test "${PIPESTATUS[0]}" = "0"

      # The pipeline's own view of the same minute: what the workers actually
      # did, and whether anything was left behind. A benchmark that only records
      # HTTP timings cannot show a run that was accepted but never finished.
      - name: Record the durable outcome
        run: |
          set -euo pipefail
          docker compose exec -T web python manage.py shell -c \
            'from core.models import WorkflowRun, TaskRun; print("RUNS=" + str(WorkflowRun.objects.count())); print("TASKS=" + str(TaskRun.objects.count()))' \
            2>/dev/null | grep -oE '(RUNS|TASKS)=[0-9]+' | tee loadtest-results/outcome.txt
          docker compose logs --no-color scheduler publisher worker \
            | grep -cE 'recovered|reconnecting' > loadtest-results/resilience.txt || true

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: loadtest-results
          path: loadtest-results/
          if-no-files-found: error
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v

  secrets:
    # Phase 11 requires a secret scan over the full history, not just the
    # working tree — a credential deleted in a later commit is still in the
    # object database and still has to be rotated. gitleaks walks every commit
    # reachable from HEAD.
    #
    # The scan is fast and needs no build, so it runs in its own job and in
    # parallel with everything else: a leaked credential is worth failing before
    # the test suite has even started.
    #
    # The scanner is the gitleaks BINARY, installed from its release tarball —
    # not `gitleaks/gitleaks-action`. The action is distributed under a
    # proprietary EULA that requires a paid license key for repositories owned
    # by a GitHub Organization and forbids redistribution as part of a product;
    # the binary is MIT. Same scanner, same config, same rules, same version, no
    # license dependency. This was found while adding the scan and is the reason
    # the action is not used here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: v8.24.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs the object database, not a shallow clone.
          fetch-depth: 0

      - name: Install gitleaks (MIT-licensed binary)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        # `--redact` so a real finding is reported without its value being
        # written to the job log, which is world-readable on a public repo.
        # `--config` allowlists two reviewed false positives by commit, file,
        # rule and line; it disables no rule and excludes no path.
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --no-banner --redact \
            --report-format sarif --report-path gitleaks-history.sarif

      - name: Scan the working tree
        # The history scan above stops at HEAD. An untracked file is not in any
        # commit, so it needs its own pass — that is where a developer is most
        # likely to have just written one.
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --no-banner --redact \
            --report-format sarif --report-path gitleaks-tree.sarif

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gitleaks-reports
          path: |
            gitleaks-history.sarif
            gitleaks-tree.sarif
          if-no-files-found: error
          retention-days: 7

  supply-chain:
    # Builds the production image once and runs everything that needs an image:
    # a Trivy vulnerability scan, a CycloneDX SBOM, and — on main only — a
    # keyless cosign signature and a build-provenance attestation.
    #
    # Why the signing half is conditional: keyless signing needs an OIDC token
    # from GitHub, and GitHub does not issue one to a pull request from a fork.
    # Gating on `github.event_name == 'push'` is not a shortcut, it is the only
    # configuration in which the credential can exist.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploading the SARIF report to the Security tab.
      security-events: write
      # Pushing to GHCR and attesting. Read-only is enough for the PR half.
      packages: write
      id-token: write
      # Creating the provenance attestation. `actions/attest-build-provenance`
      # with `push-to-registry: true` writes it through the attestations API;
      # without this the step fails with "Resource not accessible by
      # integration" after the image has already been pushed and signed.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build the production image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: production
          push: false
          load: true
          tags: flowforge:supply-chain
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image with Trivy (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flowforge:supply-chain
          scan-type: image
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # This step always succeeds so the SARIF is generated and uploaded
          # even when the gate below fails. The residual HIGH list is published
          # to the Security tab so it is visible rather than buried.
          exit-code: "0"
          ignore-unfixed: false
          format: sarif
          output: trivy-image.sarif
          skip-setup-trivy: false
          # The version the residual-risk numbers in this repository were
          # measured with. Left unpinned, the action's default moves and the
          # documented finding counts stop matching what CI reports.
          version: "v0.76.1"

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Publish the Trivy findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c # v3.28.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true

      - name: Gate on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flowforge:supply-chain
          scan-type: image
          scanners: vuln
          severity: CRITICAL
          # The gate is fixable CRITICAL only. At the time this job was written
          # the image carried one unfixed CRITICAL (CVE-2026-111497 in libbrotli1
          # on Debian 13.7) and 48 HIGH findings with no fixed version, all in
          # base OS packages that the runtime does not execute. `apt-get upgrade`
          # does not clear them and no amount of application code will. Failing
          # the build on unfixed base-image CVEs would make the gate permanently
          # red and therefore ignored.
          exit-code: "1"
          ignore-unfixed: true
          format: table
          skip-setup-trivy: false
          version: "v0.76.1"

      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          image: flowforge:supply-chain
          format: cyclonedx-json
          output-file: flowforge-sbom.cdx.json
          upload-artifact: true
          artifact-name: flowforge-sbom
          # The input is `upload-artifact-retention`; there is no
          # `retention-days` input, and passing one is silently ignored.
          upload-artifact-retention: 90
          # Deliberately off here. This job also runs on pull requests, where
          # there is no release to attach to, and the action fails when it
          # cannot find one. The release workflow attaches the SBOM from this
          # artifact instead — see .github/workflows/release.yml.
          upload-release-assets: false

      # ---------------------------------------------------------------------
      # Signing and provenance: main only.
      # ---------------------------------------------------------------------
      # Docker requires a lowercase repository path, and `github.repository`
      # keeps the owner's capitalisation (`Abolfazlrwm/flowforge`), so
      # `ghcr.io/${{ github.repository }}` is rejected with "repository name must
      # be lowercase". Lowercase it once, here, instead of hardcoding the name in
      # four places.
      #
      # This does NOT apply to the cosign certificate identity below: that is the
      # OIDC claim, which carries the canonical case, so it keeps
      # `github.repository` as-is.
      - name: Resolve the image name
        id: image
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

          # The chart and the static manifests deploy a fixed repository. Assert
          # they agree with what this job will push, so a rename cannot silently
          # split "the image CI builds" from "the image the chart pulls".
          #
          # This assertion runs on every pull request, which is the point: the
          # push below only runs on main, so without it the tag format would be
          # exercised for the first time on main — which is exactly how the
          # uppercase-owner bug reached the default branch.
          chart_repo=$(awk '/^[[:space:]]*repository:/ {print $2; exit}' \
            deployment/kubernetes/helm/flowforge/values.yaml)
          if [ "${chart_repo}" != "${name}" ]; then
            echo "the chart deploys '${chart_repo}', but CI pushes '${name}'"
            exit 1
          fi
          echo "image name agrees with the chart: ${name}"

      - name: Sign in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and sign the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push-sign
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: steps.push-sign.outcome == 'success'
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign the image (keyless)
        # Keyless: the signature's identity is the GitHub Actions OIDC token for
        # this workflow run, recorded in the Rekor transparency log. There is no
        # private key to store, rotate or leak, and anyone can verify the
        # signature without being given a public key.
        if: steps.push-sign.outcome == 'success'
        env:
          # Sign the digest the push actually produced, not the tag: a tag can be
          # moved, and cosign warns when asked to sign one.
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push-sign.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yml" \
            --certificate-oidc-issuer-regexp "https://token.actions.githubusercontent.com" \
            "${IMAGE}" > /dev/null
          echo "signed and verified: ${IMAGE}"

      - name: Attest the build provenance
        if: steps.push-sign.outcome == 'success'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push-sign.outputs.digest }}
          push-to-registry: true

  k8s:
    # Validates the Kubernetes deliverables on every push/PR. It lints the Helm
    # chart and renders it to manifests that it then checks with kubeconform in
    # strict mode. helm and kubeconform are downloaded directly (the same pattern
    # as the gitleaks binary in the `secrets` job) so no further pinned actions
    # are introduced here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install helm
        run: |
          set -euo pipefail
          HELM_VERSION=3.16.3
          curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tgz
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KC_VERSION=0.6.7
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KC_VERSION}/kubeconform-linux-amd64.tar.gz" -o kc.tgz
          tar -xzf kc.tgz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint deployment/kubernetes/helm/flowforge

      - name: Render and validate with kubeconform
        run: |
          set -euo pipefail
          helm template ff deployment/kubernetes/helm/flowforge --namespace flowforge > /tmp/ff.yaml
          kubeconform -strict -summary /tmp/ff.yaml
          # Keep the committed static manifests in sync with the chart.
          helm template ff deployment/kubernetes/helm/flowforge --namespace flowforge > deployment/kubernetes/manifests/flowforge.yaml
          if ! git diff --quiet deployment/kubernetes/manifests/flowforge.yaml; then
            echo "::error::deployment/kubernetes/manifests/flowforge.yaml is out of sync with the chart; run 'helm template ff deployment/kubernetes/helm/flowforge --namespace flowforge > deployment/kubernetes/manifests/flowforge.yaml' and commit."
            git diff --stat deployment/kubernetes/manifests/flowforge.yaml
            exit 1
          fi
