name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy django-stubs djangorestframework-stubs django-environ structlog
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy taskforge core api --ignore-missing-imports
        env:
          DJANGO_SETTINGS_MODULE: taskforge.settings
          DJANGO_SECRET_KEY: ci-secret

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: taskforge.settings
          DJANGO_SECRET_KEY: ci-secret
          DATABASE_URL: postgres://taskforge:taskforge@localhost:5432/taskforge
          REDIS_URL: redis://localhost:6379/0
      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: taskforge.settings
          DJANGO_SECRET_KEY: ci-secret
          DATABASE_URL: postgres://taskforge:taskforge@localhost:5432/taskforge
          REDIS_URL: redis://localhost:6379/0
      - name: Run tests
        run: pytest tests/unit -v --cov --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: taskforge.settings
          DJANGO_SECRET_KEY: ci-secret
          DATABASE_URL: postgres://taskforge:taskforge@localhost:5432/taskforge
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --target production -t taskforge:ci .
