name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # All actions are pinned to commit SHAs; Dependabot keeps them current.
  UV_VERSION: "0.12.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify lock file is current
        run: uv lock --check
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy flowforge core api --ignore-missing-imports
        env:
          DJANGO_SETTINGS_MODULE: flowforge.settings.test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: flowforge.settings.test
      DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Migration check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: uv run python manage.py migrate --noinput
      - name: Run tests
        run: uv run pytest tests/unit -v --cov --cov-report=xml
      - name: Upload coverage
        # fail_ci_if_error is false so a Codecov outage cannot block a merge.
        # The consequence is that a green run does NOT prove the upload worked:
        # a broken upload is silent. Check the "Upload coverage" step log for a
        # processed-upload line rather than trusting the job colour.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build production image
        run: docker build --target production -t flowforge:ci .

      - name: Start the full stack
        run: docker compose up -d --build

      # The migrate service is a one-shot gate that web/worker/scheduler wait
      # on. Assert it exited 0, so a broken migration fails loudly here rather
      # than surfacing as a readiness timeout.
      - name: Migration gate exited cleanly
        run: |
          set -euo pipefail
          cid="$(docker compose ps -aq migrate)"
          test -n "$cid"
          docker inspect -f 'migrate status={{.State.Status}} exit={{.State.ExitCode}}' "$cid"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$cid")" = "0"

      - name: Wait for readiness
        run: |
          set -uo pipefail
          code=""
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' \
              http://localhost:8000/health/ready/ || true)
            if [ "$code" = "200" ]; then
              echo "stack ready after ${attempt} attempt(s)"
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          echo "stack never became ready; last status=${code}"
          cat /tmp/ready.json 2>/dev/null || true
          docker compose ps || true
          exit 1

      - name: Liveness probe
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health/live/ | tee /tmp/live.json
          grep -Eq '"status": *"alive"' /tmp/live.json

      - name: Readiness payload reports every dependency
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health/ready/ | tee /tmp/ready-ok.json
          grep -Eq '"postgres": *"ok"' /tmp/ready-ok.json
          grep -Eq '"redis": *"ok"' /tmp/ready-ok.json
          grep -Eq '"rabbitmq": *"ok"' /tmp/ready-ok.json

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
