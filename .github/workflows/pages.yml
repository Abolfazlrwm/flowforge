name: Deploy documentation

# Builds the MkDocs site -- the same `--strict` build the `docs` job in ci.yml
# runs -- and publishes it to GitHub Pages. It runs only on pushes to main, so
# the live site always reflects main; pull requests are validated by the `docs`
# job's strict build instead. `workflow_dispatch` allows a manual republish.
#
# Enabling this requires the repository's Pages source to be set to "GitHub
# Actions" once (Settings -> Pages -> Source). The first successful run then
# publishes to the site_url declared in mkdocs.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_VERSION: "0.12.5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Build the site (strict)
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
