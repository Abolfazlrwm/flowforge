name: Deploy documentation

# Builds the MkDocs site -- the same `--strict` build the `docs` job in ci.yml
# runs -- and publishes it to GitHub Pages. It runs only on pushes to main, so
# the live site always reflects main; pull requests are validated by the `docs`
# job's strict build instead. `workflow_dispatch` allows a manual republish.
#
# Enabling this requires the repository's Pages source to be set to "GitHub
# Actions" once (Settings -> Pages -> Source). The first successful run then
# publishes to the site_url declared in mkdocs.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_VERSION: "0.12.5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install from lock file
        run: uv sync --locked --extra dev
      - name: Build the site (strict)
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
