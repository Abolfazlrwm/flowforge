[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowforge"
version = "0.1.0"
description = "An open-source distributed workflow orchestration engine powered by Django, PostgreSQL, and RabbitMQ."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Abolfazlrwm" },
]
keywords = ["workflow", "orchestration", "distributed", "dag", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
]
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.17,<3.18",
    "django-filter>=24.2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6",
    "pydantic>=2.9,<3",
    "structlog>=24.4",
    "django-structlog>=9.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "django-environ>=0.11",
    "jsonschema>=4.23",
    # Phase 3 (REST API). Token auth needs no extra package — it is
    # `rest_framework.authtoken`. JWT and the OpenAPI schema do.
    "djangorestframework-simplejwt>=5.3,<6",
    "drf-spectacular>=0.27,<1",
    "pika>=1.3,<2",
    "croniter>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-xdist>=3.6",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "faker>=30.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    # Stub packages track their target's version, and the direction of drift
    # matters: stubs OLDER than the runtime produce visible false errors, while
    # stubs NEWER than the runtime let mypy accept APIs that do not exist at
    # runtime — a silent bug. So both are held at or behind the runtime:
    # django-stubs 5.2.x matches Django 5.2 exactly; DRF stubs 3.16.x is the
    # newest series that still accepts django-stubs 5.2 (3.17+ requires 6.x).
    "django-stubs>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<3.17",
    "pre-commit>=4.0",
    "coverage>=7.6",
    "httpx>=0.27",
    # Documentation site. `mkdocs build --strict` runs in CI on every pull
    # request, so a broken internal link or a nav entry with no target fails the
    # build. `pymdown-extensions` supplies `pymdownx.superfences`, which is what
    # renders the Mermaid blocks in the architecture documents.
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10.11",
    "django-filter-stubs>=0.1.0",
]

# NOTE: the `flowforge` console script is intentionally absent until the CLI
# lands in Phase 10. Declaring it now would ship a broken entry point.

[project.urls]
Homepage = "https://github.com/Abolfazlrwm/flowforge"
Documentation = "https://Abolfazlrwm.github.io/flowforge"
Repository = "https://github.com/Abolfazlrwm/flowforge"
Issues = "https://github.com/Abolfazlrwm/flowforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["flowforge", "core", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["flowforge", "core", "api", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "PTH",
    "PL", "S", "ASYNC", "ARG", "ERA", "PERF", "RUF",
]
ignore = [
    "D100", "D104", "D107", "D203", "D212", "D401", "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A pytest fixture parameter is a dependency declaration, not an argument the
# test must read: `db` enables database access and `published` seeds a row, and
# the test body legitimately uses neither. ARG cannot express that, and naming
# the fixture with a leading underscore would stop pytest injecting it.
"tests/**" = [
    "S101", "S105", "S106", "PLR2004", "D103", "ARG001", "ARG002",
]
"*/migrations/*" = ["ALL"]
"manage.py" = ["PLC0415"]
# Django reads Meta attributes as plain class attributes and rejects ClassVar
# annotations on them, so RUF012 cannot be satisfied here without breaking the
# model. The lists are never mutated at runtime.
"core/models.py" = ["RUF012"]
# `BasePermission` mandates the `request, view` signature, and these classes read
# only `request`. Renaming or dropping `view` to satisfy ARG002 would break the
# DRF contract, which is the opposite of what the rule wants.
"api/permissions.py" = ["ARG002"]
# Django's management command contract mandates the `(self, *args, **options)`
# `handle` signature and a `BaseCommand.add_arguments(self, parser)` parser that
# is an `argparse.ArgumentParser`. The variadic `*args` is unused by most commands
# and the framework import can only live inside the method, so the same three rules
# that `api/permissions.py` and `manage.py` already relax apply here too.
"core/management/commands/*.py" = ["PLC0415", "S101", "ARG002"]
# `build_publisher` imports the RabbitMQ publisher lazily so the rest of the code
# (and the test suite, which uses the fake) never pulls pika into the import graph.
# The deliberate in-function import is the mechanism, so PLC0415 does not apply here.
"core/broker.py" = ["PLC0415"]
# DRF declares `permission_classes` and `ordering` as plain (non-`ClassVar`)
# attributes on its base classes, and the stubs keep that same shape. Annotating
# them `ClassVar` in a subclass — which is what RUF012 wants for a mutable
# class attribute — makes mypy reject the override. Leaving them plain matches
# the framework it is configuring, which matters more than the lint rule here;
# they are never rebound per instance.
"api/views.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations", "tests", "venv", ".venv"]

[tool.django-stubs]
django_settings_module = "flowforge.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "flowforge.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "concurrency: marks tests that validate concurrent behavior",
]

[tool.coverage.run]
source = ["flowforge", "core", "api"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
