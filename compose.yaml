name: flowforge

# Local development stack.
#
# The image target is `production` (so the container layout matches what ships),
# but DJANGO_SETTINGS_MODULE points at the dev settings and the source tree is
# bind-mounted over /app for hot reload. That is intentional: one Dockerfile
# serves both purposes, and the dev stack exercises the same dependency install
# as the shipped image.
#
# Shared environment. Defined once so the application services cannot drift
# apart (they previously did: scheduler and worker were missing
# DJANGO_ALLOWED_HOSTS).
x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret}
  DJANGO_DEBUG: "True"
  DJANGO_SETTINGS_MODULE: flowforge.settings.dev
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://flowforge:flowforge@db:5432/flowforge
  REDIS_URL: redis://redis:6379/0
  # Default vhost `/` is a single trailing slash; `//` parses as an empty vhost.
  # A dedicated user, not `guest`, because RabbitMQ restricts guest to loopback
  # and the app containers connect over the compose network.
  RABBITMQ_URL: amqp://flowforge:flowforge@rabbitmq:5672/
  # Observability. The processes that run no web server expose their own metrics
  # endpoint when given a port; zero disables it. The web process serves the same
  # registry at /api/v1/metrics/ on port 8000 and needs no extra port.
  SCHEDULER_METRICS_PORT: ${SCHEDULER_METRICS_PORT:-9101}
  PUBLISHER_METRICS_PORT: ${PUBLISHER_METRICS_PORT:-9102}
  WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9103}
  # Empty by default so the plain stack does not try to export spans to a
  # collector that is not running. See the observability profile below.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

# Shared healthcheck for the processes that run no HTTP server. The Dockerfile's
# port-8000 check would always fail for them; `manage.py healthcheck` verifies the
# database and broker they actually depend on.
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "manage.py", "healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration gate.
  #
  # Django's migrate command is not safe to run concurrently against the same
  # database: two processes racing on CREATE TABLE lose with
  # `ProgrammingError: relation "..." already exists`. Previously web, publisher
  # and scheduler each ran migrate on startup, so the stack passed or failed
  # depending on container start ordering.
  #
  # Every service that needs the schema now waits for this one to exit 0.
  migrate:
    build:
      context: .
      target: production
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  scheduler:
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      # Loopback only: Prometheus scrapes `scheduler:9101` over the compose
      # network, so this mapping exists purely so a developer can curl the
      # endpoint from the host.
      - "127.0.0.1:9101:9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    # Shell form, not a list: the port comes from this service's environment,
    # and compose only interpolates `${...}` in a list command from the host.
    command: python manage.py scheduler --metrics-port "$SCHEDULER_METRICS_PORT"
    healthcheck: *app-healthcheck

  publisher:
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    command: python manage.py publisher --metrics-port "$PUBLISHER_METRICS_PORT"
    healthcheck: *app-healthcheck

  worker:
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      - "127.0.0.1:9103:9103"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    command: python manage.py worker --metrics-port "$WORKER_METRICS_PORT"
    healthcheck: *app-healthcheck

  # --- observability profile -------------------------------------------------
  #
  # `docker compose --profile observability up` adds a complete local
  # observability stack. The application services above are unchanged: their
  # metrics endpoints and their log format are always on, so the only thing
  # this profile buys is somewhere to scrape and look at them.
  #
  # Traces need one more variable, because an OTLP endpoint that is always set
  # would make the default stack log export failures against a collector that
  # is not running:
  #
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
  #     docker compose --profile observability up
  #
  # Metrics and dashboards work with no extra configuration.

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      # Anonymous admin access is deliberate for a local dev stack; the
      # dashboard is read-only and the port is bound to the host only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"
      - "4317:4317"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
