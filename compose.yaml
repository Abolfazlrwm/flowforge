name: flowforge

# Local development stack.
#
# The image target is `production` (so the container layout matches what ships),
# but DJANGO_SETTINGS_MODULE points at the dev settings and the source tree is
# bind-mounted over /app for hot reload. That is intentional: one Dockerfile
# serves both purposes, and the dev stack exercises the same dependency install
# as the shipped image.
#
# Shared environment. Defined once so the application services cannot drift
# apart (they previously did: scheduler and worker were missing
# DJANGO_ALLOWED_HOSTS).
x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret}
  DJANGO_DEBUG: "True"
  DJANGO_SETTINGS_MODULE: flowforge.settings.dev
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://flowforge:flowforge@db:5432/flowforge
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration gate.
  #
  # Django's migrate command is not safe to run concurrently against the same
  # database: two processes racing on CREATE TABLE lose with
  # `ProgrammingError: relation "..." already exists`. Previously web, worker
  # and scheduler each ran migrate on startup, so the stack passed or failed
  # depending on container start ordering.
  #
  # Every service that needs the schema now waits for this one to exit 0.
  migrate:
    build:
      context: .
      target: production
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  scheduler:
    build:
      context: .
      target: production
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["celery", "-A", "flowforge", "beat", "-l", "info"]

  worker:
    build:
      context: .
      target: production
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["celery", "-A", "flowforge", "worker", "-l", "info"]

volumes:
  postgres_data:
