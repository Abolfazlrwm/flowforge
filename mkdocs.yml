site_name: FlowForge
site_description: An open-source distributed workflow orchestration engine.
# Lowercase, because this value is used verbatim for canonical URLs and the
# sitemap; GitHub Pages serves the host case-insensitively but the emitted
# absolute URLs should match the canonical form.
site_url: https://abolfazlrwm.github.io/flowforge
repo_url: https://github.com/Abolfazlrwm/flowforge
repo_name: Abolfazlrwm/flowforge

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data Model: architecture/data-model.md
      - Execution Model: architecture/execution-model.md
      - Workflow Definitions: architecture/definitions.md
      - Failure Model: architecture/failure-model.md
  - API:
      - Overview: api/overview.md
      - Reference: api/reference.md
  - Client:
      - Python SDK: sdk/index.md
      - Command Line: cli.md
  - Security:
      - Threat Model: security/threat-model.md
  - Development:
      - Setup: development/setup.md
      - Roadmap: development/ROADMAP.md
      - Progress: development/PROGRESS.md
      - Decisions: development/DECISIONS.md
      - Naming Analysis: development/NAMING_ANALYSIS.md
      - Audit Report: development/AUDIT_REPORT.md
      - Load Testing: development/load-testing.md
      - Benchmarks: development/BENCHMARKS.md
  - Deployment:
      - Docker: deployment/docker.md
      - Kubernetes: deployment/kubernetes.md
      - Migrations: deployment/migrations.md
      - Backup and Restore: deployment/backup-restore.md
      - High Availability: deployment/ha.md
      - Observability: deployment/observability.md
  - ADRs:
      - Index: adr/index.md
      - Celery as interim task infrastructure: adr/ADR-007-celery-as-interim-task-infrastructure.md
      - Project name evaluation: adr/ADR-009-project-name-evaluation.md
      - Django 5.2 LTS: adr/ADR-010-django-5-2-lts.md
      - Custom scheduler and transactional outbox: adr/ADR-011-custom-scheduler-and-transactional-outbox.md
      - Retry policy and dead-letter semantics: adr/ADR-012-retry-policy-and-dead-letter-semantics.md
      - The event log is transactional: adr/ADR-013-event-log-is-transactional.md
      - Multi-tenancy (shared schema): adr/ADR-014-multi-tenancy-shared-schema.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  # `attr_list` and `md_in_html` are what make the Material "grid cards" on the
  # home page work: the cards are a <div markdown> block, and without
  # `md_in_html` the markdown inside it is emitted as literal text (bold `**`
  # and `:octicons-...:` shown verbatim). `attr_list` supplies the `{ .lg }`
  # attribute syntax those cards use.
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  # The icon shortcodes (`:octicons-arrow-right-24:`) need this; Material ships
  # the index and the SVG renderer, so no extra dependency is introduced.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      # Without this block the Mermaid in the architecture documents renders as
      # a plain code block instead of a diagram. `--strict` proves the extension
      # loaded; it cannot prove a diagram is syntactically valid Mermaid.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Also set in the file, not only on the command line, so a local `mkdocs build`
# fails on exactly what CI fails on instead of printing warnings and passing.
strict: true
