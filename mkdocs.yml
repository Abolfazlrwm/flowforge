site_name: FlowForge
site_description: An open-source distributed workflow orchestration engine.
site_url: https://Abolfazlrwm.github.io/flowforge
repo_url: https://github.com/Abolfazlrwm/flowforge
repo_name: Abolfazlrwm/flowforge

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
  - Development:
      - Setup: development/setup.md
      - Roadmap: development/ROADMAP.md
      - Progress: development/PROGRESS.md
      - Decisions: development/DECISIONS.md
      - Naming Analysis: development/NAMING_ANALYSIS.md
      - Audit Report: development/AUDIT_REPORT.md
  - Deployment:
      - Docker: deployment/docker.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
