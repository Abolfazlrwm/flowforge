repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # The gitleaks BINARY hook, not `gitleaks/gitleaks-action` — the action is
  # distributed under a proprietary EULA that requires a paid license key for
  # Organization-owned repositories and forbids redistribution as part of a
  # product. The binary is MIT. See the `secrets` CI job for the same decision.
  #
  # This scans the working tree only: pre-commit runs per commit, and a
  # full-history scan belongs in CI where it is cheap and blocking. The config
  # allowlists two reviewed false positives by commit, file, rule and line, and
  # disables no rule and excludes no path.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy flowforge core api --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest-unit
        name: pytest-unit
        entry: pytest tests/unit -v
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        stages: [push]
